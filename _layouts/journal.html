---
layout: page
---

<style>
  .journal-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
  }

  @media (max-width: 576px) {
    .journal-grid {
      grid-template-columns: 1fr;
    }
  }

  .journal-card {
    border-radius: 12px;
    overflow: hidden;
    background: var(--card-bg, #1e1e1e);
    border: 1px solid var(--card-border-color, rgba(150, 150, 150, 0.2));
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .journal-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
  }

  .journal-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
    border-bottom: none !important;
  }

  .journal-card-img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
  }

  .journal-card-placeholder {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #2d2d44 0%, #1b1b2f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .journal-card-placeholder i {
    font-size: 2.5rem;
    opacity: 0.25;
    color: var(--heading-color, #c9d1d9);
  }

  .journal-card-body {
    position: relative;
    margin-top: -2.5rem;
    padding: 0.75rem 0.9rem 0.85rem;
    border-radius: 0 0 12px 12px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  [data-mode="dark"] .journal-card-body {
    background: rgba(30, 30, 40, 0.6);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .journal-card-title {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: #1a1a1a;
    margin: 0 0 0.35rem;
  }

  [data-mode="dark"] .journal-card-title {
    color: #e8e8e8;
  }

  .journal-card-date {
    font-size: 0.78rem;
    color: rgba(0, 0, 0, 0.5);
    margin-top: auto;
  }

  [data-mode="dark"] .journal-card-date {
    color: rgba(255, 255, 255, 0.5);
  }

  [data-mode="light"] .journal-card-placeholder {
    background: linear-gradient(135deg, #e8e8f0 0%, #d5d5e0 100%);
  }
</style>

<div class="journal-grid">
  {% for post in site.categories.Journal %}
    {% if post.categories[0] == "Journal" %}
    <div class="journal-card">
      <a href="{{ post.url | relative_url }}">
        {% assign img = post.image.path | default: post.image %}
        {% if img %}
        <img class="journal-card-img" src="{{ img | relative_url }}" alt="{{ post.title | xml_escape }}" loading="lazy">
        {% else %}
        <div class="journal-card-placeholder">
          <i class="fas fa-pen-fancy"></i>
        </div>
        {% endif %}
        <div class="journal-card-body">
          <div class="journal-card-title">{{ post.title }}</div>
          <span class="journal-card-date">{{ post.date | date: "%b %d, %Y" }}</span>
        </div>
      </a>
    </div>
    {% endif %}
  {% endfor %}
</div>
